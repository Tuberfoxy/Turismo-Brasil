<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <!-- Adaptação para celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reserva - Busbus Turismos</title>

    <!-- Conecta ao CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================================
         CABEÇALHO
         ========================================= -->

    <header>

        <!-- Nome da empresa -->
        <h1>Busbus Turismos</h1>

        <!-- Menu -->
        <nav>

            <a href="../">Início</a>

            <a href="../historia/">Sobre</a>

            <a href="../contato/">Contato</a>

            <a href="../destinos/">Destinos</a>

            <a href="../detalhes/">Detalhes</a>

            <a href="../reserva/">Reserva</a>

            <a href="../dashboard/">Dashboard</a>

        </nav>

    </header>


    <!-- =========================================
         CONTEÚDO
         ========================================= -->

    <main>

        <!-- Faixa transparente -->
        <div class="faixa"></div>


        <!-- Formulário -->
        <section class="reserva">

            <h2>🎫 Faça sua reserva</h2>

            <p class="descricao">
                Preencha os dados abaixo para solicitar
                sua próxima viagem com a Busbus Turismos.
            </p>


            <!-- Formulário -->
            <form>


                <!-- Nome -->
                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >


                <!-- E-mail -->
                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >


                <!-- Telefone -->
                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >


                <!-- Destino -->
                <label for="destino">
                    Escolha o destino
                </label>

                <select id="destino" required>

                    <option value="">
                        Selecione um destino
                    </option>

                    <option value="praias">
                        🏖️ Praias
                    </option>

                    <option value="serras">
                        ⛰️ Serras
                    </option>

                    <option value="historicos">
                        🏛️ Lugares Históricos
                    </option>

                    <option value="ecoturismo">
                        🌳 Ecoturismo
                    </option>

                    <option value="cidades">
                        🏙️ Cidades Turísticas
                    </option>

                    <option value="parques">
                        🎡 Parques e Lazer
                    </option>

                </select>


                <!-- Data -->
                <label for="data">
                    Data da viagem
                </label>

                <input
                    type="date"
                    id="data"
                    required
                >


                <!-- Número de pessoas -->
                <label for="pessoas">
                    Número de pessoas
                </label>

                <input
                    type="number"
                    id="pessoas"
                    min="1"
                    placeholder="Quantidade de pessoas"
                    required
                >


                <!-- Forma de pagamento -->
                <label for="pagamento">
                    Forma de pagamento
                </label>

                <select id="pagamento" required>

                    <option value="">
                        Selecione
                    </option>

                    <option value="pix">
                        PIX
                    </option>

                    <option value="cartao">
                        Cartão
                    </option>

                    <option value="boleto">
                        Boleto
                    </option>

                </select>


                <!-- Botão -->
                <button type="submit">
                    Confirmar reserva
                </button>

            </form>

        </section>

    </main>

</body>

</html>
